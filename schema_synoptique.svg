<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" role="img" aria-label="Synoptique du systeme de pilotage Radware" width="1180" height="640"><title>Synoptique du systeme de pilotage Radware</title><desc>Arduino Mega 2560 branche directement sur le bus ISA et deux cartes Radware A et B</desc>
<style>
 .bg{fill:var(--bg,#ffffff)}
 .ink{stroke:var(--ink,#1b1f24);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .thin{stroke:var(--ink,#1b1f24);fill:none;stroke-width:1}
 .box{fill:var(--box,#f4f6f8);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxA{fill:var(--boxA,#e6f0fb);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxB{fill:var(--boxB,#fdf1dc);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxC{fill:var(--boxC,#e8f5e9);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .t{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px}
 .tb{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700}
 .th{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:700}
 .m{fill:var(--ink,#1b1f24);font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
 .mm{fill:var(--mut,#59636e);font-family:ui-monospace,Consolas,Menlo,monospace;font-size:11px}
 .s{fill:var(--mut,#59636e);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:12px}
 .pwr{stroke:var(--red,#c62828);fill:none;stroke-width:1.8}
 .gnd{stroke:var(--mut,#59636e);fill:none;stroke-width:1.8}
 .sig{stroke:var(--blue,#1565c0);fill:none;stroke-width:1.5}
 .ctl{stroke:var(--grn,#2e7d32);fill:none;stroke-width:1.8}
 .clk{stroke:var(--vio,#7b1fa2);fill:none;stroke-width:1.8}
 .dot{fill:var(--ink,#1b1f24)}
 .warn{fill:var(--warnbg,#fff4e5);stroke:var(--warn,#e65100);stroke-width:1.4}
</style>
<rect class="bg" width="1180" height="640"/><text class="th" x="24" y="34" text-anchor="start">Synoptique : Arduino Mega -&gt; bus ISA -&gt; cartes Radware A et B</text><rect class="box" x="24" y="70" width="200" height="150" rx="6"/><text class="tb" x="124" y="96" text-anchor="middle">PC</text><text class="s" x="124" y="118" text-anchor="middle">Console / moniteur serie</text><text class="s" x="124" y="136" text-anchor="middle">OmniRig (CAT Kenwood)</text><text class="s" x="124" y="154" text-anchor="middle">HDSDR / SDR logiciel</text><text class="s" x="124" y="186" text-anchor="middle">Carte son : entree ligne</text><text class="s" x="124" y="204" text-anchor="middle">(I et Q des cartes)</text><rect class="boxC" x="300" y="70" width="330" height="150" rx="6"/><text class="tb" x="465" y="96" text-anchor="middle">Arduino MEGA 2560</text><text class="s" x="465" y="116" text-anchor="middle">(2e port CAT possible : Serial1)</text><text class="m" x="465" y="142" text-anchor="middle">SD0-7 : D22-29   SD8-15 : D37-30</text><text class="m" x="465" y="160" text-anchor="middle">SA0-7 : D49-42   SA8-9 : D53, D52</text><text class="m" x="465" y="178" text-anchor="middle">/IOW : D8</text><text class="s" x="465" y="204" text-anchor="middle">firmware radware_ctrl</text><line class="sig" x1="224" y1="110" x2="300" y2="110"/><line class="sig" x1="300" y1="110" x2="292.18962738290116" y2="105.52807875940637"/><line class="sig" x1="300" y1="110" x2="292.18962738290116" y2="114.47192124059363"/><line class="sig" x1="300" y1="130" x2="224" y2="130"/><line class="sig" x1="224" y1="130" x2="231.81037261709884" y2="134.47192124059362"/><line class="sig" x1="224" y1="130" x2="231.81037261709884" y2="125.52807875940637"/><text class="s" x="262" y="102" text-anchor="middle">USB</text><rect class="box" x="900" y="70" width="256" height="150" rx="6"/><text class="tb" x="1028" y="96" text-anchor="middle">Bus ISA (support 2 slots)</text><text class="m" x="1028" y="120" text-anchor="middle">SD0-SD15  SA0-SA9  /IOW</text><text class="m" x="1028" y="140" text-anchor="middle">+5 V  +12 V  -5 V  GND</text><text class="m" x="1028" y="160" text-anchor="middle">B30 = horloge 10 MHz</text><text class="s" x="1028" y="190" text-anchor="middle">tout est en parallele sur A et B</text><line class="sig" x1="630" y1="125" x2="900" y2="125"/><line class="sig" x1="900" y1="125" x2="892.1896273829011" y2="120.52807875940637"/><line class="sig" x1="900" y1="125" x2="892.1896273829011" y2="129.47192124059364"/><line class="ctl" x1="630" y1="175" x2="900" y2="175"/><line class="ctl" x1="900" y1="175" x2="892.1896273829011" y2="170.52807875940636"/><line class="ctl" x1="900" y1="175" x2="892.1896273829011" y2="179.47192124059364"/><text class="s" x="765" y="117" text-anchor="middle">26 lignes, 1 fil chacune</text><text class="s" x="765" y="192" text-anchor="middle">/IOW</text><rect class="boxA" x="900" y="300" width="120" height="200" rx="6"/><text class="tb" x="960" y="328" text-anchor="middle">Carte A</text><text class="s" x="960" y="350" text-anchor="middle">recepteur A</text><text class="s" x="960" y="378" text-anchor="middle">SW1 = base</text><text class="m" x="960" y="396" text-anchor="middle">0x300</text><text class="s" x="960" y="430" text-anchor="middle">J5 antenne</text><text class="s" x="960" y="448" text-anchor="middle">J1/J2 audio I/Q</text><text class="s" x="960" y="466" text-anchor="middle">FA -&gt; VFO A</text><rect class="boxB" x="1036" y="300" width="120" height="200" rx="6"/><text class="tb" x="1096" y="328" text-anchor="middle">Carte B</text><text class="s" x="1096" y="350" text-anchor="middle">recepteur B</text><text class="s" x="1096" y="378" text-anchor="middle">SW1 = base</text><text class="m" x="1096" y="396" text-anchor="middle">0x310</text><text class="s" x="1096" y="430" text-anchor="middle">J5 antenne</text><text class="s" x="1096" y="448" text-anchor="middle">J1/J2 audio I/Q</text><text class="s" x="1096" y="466" text-anchor="middle">FB -&gt; VFO B</text><line class="sig" x1="960" y1="220" x2="960" y2="300"/><line class="sig" x1="1096" y1="220" x2="1096" y2="300"/><circle class="dot" cx="960" cy="260" r="3.2"/><circle class="dot" cx="1096" cy="260" r="3.2"/><line class="sig" x1="960" y1="260" x2="1096" y2="260"/><rect class="warn" x="300" y="330" width="220" height="130" rx="6"/><text class="tb" x="410" y="356" text-anchor="middle">Alimentation externe</text><text class="m" x="410" y="380" text-anchor="middle">+5 V &gt;= 1 A (estim.)</text><text class="m" x="410" y="398" text-anchor="middle">+12 V ~ 300 mA</text><text class="m" x="410" y="416" text-anchor="middle">-5 V ~ 10 mA (ICL7660)</text><text class="s" x="410" y="440" text-anchor="middle">masse commune Arduino</text><polyline class="pwr" points="410,330 410,262 870,262 870,196 900,196"/><text class="s" x="640" y="255" text-anchor="middle">+5 V / +12 V / -5 V / GND</text><rect class="box" x="600" y="330" width="220" height="130" rx="6"/><text class="tb" x="710" y="356" text-anchor="middle">Reference 10 MHz</text><text class="s" x="710" y="380" text-anchor="middle">OCXO / GPSDO / module</text><text class="s" x="710" y="398" text-anchor="middle">conditionneur 74AHCT04</text><text class="m" x="710" y="424" text-anchor="middle">sortie CMOS 5 V</text><text class="m" x="710" y="442" text-anchor="middle">-&gt; ISA B30 (OSC)</text><polyline class="clk" points="710,330 710,284 885,284 885,210 900,210"/><text class="s" x="790" y="298" text-anchor="middle">10 MHz</text><polyline class="sig" points="960,500 960,560 124,560 124,220"/><text class="s" x="540" y="552" text-anchor="middle">audio I et Q (jacks J1 / J2 de chaque carte) vers la carte son du PC</text><text class="s" x="960" y="530" text-anchor="middle">antenne A</text><text class="s" x="1096" y="530" text-anchor="middle">antenne B</text><line class="sig" x1="960" y1="520" x2="960" y2="502"/><line class="sig" x1="960" y1="502" x2="955.5280787594064" y2="509.81037261709884"/><line class="sig" x1="960" y1="502" x2="964.4719212405936" y2="509.81037261709884"/><line class="sig" x1="1096" y1="520" x2="1096" y2="502"/><line class="sig" x1="1096" y1="502" x2="1091.5280787594063" y2="509.81037261709884"/><line class="sig" x1="1096" y1="502" x2="1100.4719212405937" y2="509.81037261709884"/><text class="s" x="24" y="610" text-anchor="start">Les cartes sont en ecriture seule : le logiciel ne lit rien sur le bus (pas de /IOR, pas d'IRQ, pas de DMA).</text></svg>