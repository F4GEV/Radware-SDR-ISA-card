REM The following two lines are for PC-Install for DOS
TITLEBACKGROUND: BRIGHT CYAN
SCREENFILLCHAR: "ACME    ", 2

REM The following line is for PC-Install for Windows
REM SCREENCOLOR: red, yellow
REM SCREENGRAPHIC: logo.bmp, bottomright

TITLE: "ACME Zip Code Finder - Installation Program"

BEGINFIRSTSCREEN
  Thank you for purchasing the ACME Zip Code Finder.  
  We are certain that you will find immediate productivity  
  gains having a zip code directory at your finger tips.
ENDFIRSTSCREEN

MINDISKSPACE: 100000
MINCPUTYPE: 80286

IF LOCATE("zipcode.exe")
DEFAULTDIR: $locatedir$, prompt="Please enter directory for program upgrade:"
ELSE
DEFAULTDIR: c:\zipcode
ENDIF

AUTOEXEC: addpath, ask
CONFIG: buffermin=40, filemin=30, ask

REM The following line is for PC-Install for Windows
REM INIFILE: "Windows", "load", "$DEFAULTDIR$\zipcode.exe", Win.ini, add, ask

BEGINGROUP

10  [X]  Full Installation

20  [ ]  Partial Installation (omits demo)  

ENDGROUP

FILE: zipcode.exe, overwrite=no, group=10,20
FILE: ziphelp.txt, overwrite=no, group=10
FILE: newinfo.txt, overwrite=no, group=10,20
INSERTDISK: "Disk Two"
FILE: ?0000.dat, overwrite=new, group=10,20
INSERTDISK: "Disk Three"
FILE: ?0000.dat, overwrite=new, group=10,20

REM The following line is for PC-Install for Windows
REM WINITEM: "Zip Codes", "Zipcode.exe", "Zip Finder"

BEGINLASTSCREEN

  ACME technical support is available at (800) 555-0000.  
 
ENDLASTSCREEN

SHOWREADME: newinfo.txt

RUNATEXIT: "zipcode.exe"
