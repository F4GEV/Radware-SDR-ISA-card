SCREENCOLOR: blue,black
TITLE: "RADWARE ver 1.17x INSTALLATION",bold,italic
TITLECOLOR: white
BEGINFIRSTSCREEN

    Welcome to RADWARE. This Installation program will ask you several
  questions and then install RADWARE onto your hard disk. If you do not have
  a PSA compatible sound card, we will install this software in simulation
  mode. All files that we modify will be copyed to a CCI subdirectory of your
  installation directory before modification to allow you to replace them if
  the installation causes you system problems. We subjest that you delete
  these files once you are satisfied with the installation. If you experience
  any problems, feel free to call us at (619) 599-0476.
    The x in version 1.17x represents an experimental version. We believe this
  version to be very close to correct, but due to the large quantity of code,
  we realize that the potention for problems is high. This installation will
  not write over the old programs, and you will still be able to run an old
  version if this one was loaded over the top of it. Please do not open two
  versions of RADWARE at the same time!!!
                                     Alan D. Comer

ENDFIRSTSCREEN
BEGINLASTSCREEN

    If you have changed the address of the RADWARE board
  itself, you can inform your RADWARE program of this by
  entering the configuration dialog from the main menu. Be 
  sure to do this in every version of the program that you
  run.
    Brian, Alan, and Jean wish to thank you for choosing the 
  RADWARE system, and hope that the airwaves are good for
  all of us.

ENDLASTSCREEN
MINDISKSPACE: 2000000
DEFAULTDIR: C:\RADWARE
OVERWRITEFILE:YES
FILE: $DEFAULTDIR$\CCI\SYSTEM.INI, SOURCE=$WINDIR$
FILE:$WINSYSDIR$\DLLS.ZIP,OVERWRITE = NEW
FILE:$DEFAULTDIR$\RADWARE.EXE
FILE:$DEFAULTDIR$\RADWARE.LD
FILE:$DEFAULTDIR$\*.PLC
FILE:$DEFAULTDIR$\*.SET
FILE:$DEFAULTDIR$\*.STA
FILE:$DEFAULTDIR$\RADHELP.HLP
FILE:$DEFAULTDIR$\UPDATE.TXT
FILE:$DEFAULTDIR$\README.TXT
FILE:$DEFAULTDIR$\INITRAD.EXE
WINITEM: "RADWARE","RADWARE.EXE TR1","Amateur Transceiver (1.17x)","$DEFAULTDIR$\","$DEFAULTDIR$\RADWARE.EXE",7,REPLACE
WINITEM: "RADWARE","RADWARE.EXE SW1","Short Wave Receiver (1.17x)","$DEFAULTDIR$\","$DEFAULTDIR$\RADWARE.EXE",7,REPLACE
WINITEM: "RADWARE","NOTEPAD.EXE $DEFAULTDIR$\README.TXT","readme.txt","$WINDIR$","$WINDIR$\NOTEPAD.EXE",0
WINITEM: "RADWARE","NOTEPAD.EXE $DEFAULTDIR$\UPDATE.TXT","update.txt","$WINDIR$","$WINDIR$\NOTEPAD.EXE",0
WINITEM: "STARTUP","INITRAD.EXE","Initialize Radware","$DEFAULTDIR$\","$DEFAULTDIR$\DSP1.EXE",1

