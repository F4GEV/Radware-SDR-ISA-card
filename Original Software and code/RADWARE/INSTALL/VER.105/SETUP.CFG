SCREENCOLOR: blue,black
TITLE: "RADWARE ver 1.05 INSTALLATION",bold,italic
TITLECOLOR: white
BEGINFIRSTSCREEN

    Welcome to RADWARE. This Installation program will ask you         
  several questions and then install RADWARE onto your hard disk.
  If you do not have a PSA compatible sound card, we will install
  this software in simulation mode. All files that we modify will
  be copyed to a CCI subdirectory of your installation directory
  before modification to allow you to replace them if the 
  installation causes you system problems. We subjest that you 
  delete these files once you are satisfied with the installation.
  If you experience any problems, feel free to call us at 
 (619) 599-0476. 
                                      Alan D. Comer

ENDFIRSTSCREEN
BEGINLASTSCREEN

    Your RADWARE card has now been installed. You need to set          
  the sound card driver to the appropriate address, dma channel,
  and IRQ 10. We will open the Control Panel, followed by
  Drivers for you. Then Click on PSA SDK... and the click on
  Setup. This will allow you to change the settings that 
  RADWARE uses to talk to the sound card. 
    If you have changed the address of the RADWARE board
  itself, you can inform your RADWARE program of this by
  entering the configuration dialog from the main menu. Be 
  sure to do this in every version of the program that you
  run.
    Brian, Alan, Jean, and Ron wish to thank you for choosing
  the RADWARE system, and hope that the airwaves are good for
  all of us.

ENDLASTSCREEN
MINDISKSPACE: 2000000
DEFAULTDIR: D:\RADWARE
OVERWRITEFILE:YES
IF LOCATE(DSPMGR.INI)
FILE: $DEFAULTDIR$\CCI\DSPMGR.INI, source=$LOCATEDIR$
ENDIF
FILE: $DEFAULTDIR$\CCI\SYSTEM.INI, SOURCE=$WINDIR$
IF LOCATE(SYNTH.LD)
INIFILE: "RADIO", "file", "$DEFAULTDIR$\radio.ld", $WINDIR$\dspmgr.ini
INIFILE: "RADIO", "clock", "16000000", dspmgr.ini
INIFILE: "RADIO", "processor", "DSP_ADSP2101 DSP_ADSP2115", dspmgr.ini
INIFILE: "RADIO", "scopecompatible", "yes", dspmgr.ini
INIFILE: "DSP001", "file", "$LOCATEDIR$\SYNTH.ld", dspmgr.ini
INIFILE: "DSP001", "clock", "16000000", dspmgr.ini
INIFILE: "DSP001", "processor", "DSP_ADSP2101 DSP_ADSP2115", dspmgr.ini
INIFILE: "DSP001", "scopecompatible", "yes", dspmgr.ini
INIFILE: "DRIVERS", "driver1", "psasdk", dspmgr.ini
ENDIF
IF LOCATE(DSP001.LD)
INIFILE: "RADIO", "file", "$DEFAULTDIR$\radio.ld", $WINDIR$\dspmgr.ini
INIFILE: "RADIO", "clock", "16000000", dspmgr.ini
INIFILE: "RADIO", "processor", "DSP_ADSP2101 DSP_ADSP2115", dspmgr.ini
INIFILE: "RADIO", "scopecompatible", "yes", dspmgr.ini
INIFILE: "DSP001", "file", "$LOCATEDIR$\DSP001.ld", dspmgr.ini
INIFILE: "DSP001", "clock", "16000000", dspmgr.ini
INIFILE: "DSP001", "processor", "DSP_ADSP2101 DSP_ADSP2115", dspmgr.ini
INIFILE: "DSP001", "scopecompatible", "yes", dspmgr.ini
INIFILE: "DRIVERS", "driver1", "psasdk", dspmgr.ini
ENDIF
INIFILE: "DRIVERS", "PSASDK", "PSASDK.DRV", SYSTEM.INI
INIFILE: "PSASDK", "baseaddress1", "0x200", SYSTEM.INI
INIFILE: "PSASDK", "dma1", "0", SYSTEM.INI
INIFILE: "PSASDK", "irq1", "10", SYSTEM.INI
FILE:$WINSYSDIR$\DLLS.ZIP,OVERWRITE = NEW
FILE:$WINDIR$\PSASDK.DRV
FILE:$DEFAULTDIR$\DSP1.EXE
FILE:$DEFAULTDIR$\RADIO.LD
FILE:$DEFAULTDIR$\*.PLC
FILE:$DEFAULTDIR$\*.SET
FILE:$DEFAULTDIR$\*.STA
FILE:$DEFAULTDIR$\UPDATE.TXT
FILE:$DEFAULTDIR$\README.TXT
WINITEM: "RADWARE","DSP1.EXE TR1","Amateur Transceiver","$DEFAULTDIR$\","$DEFAULTDIR$\DSP1.EXE",7,REPLACE
WINITEM: "RADWARE","DSP1.EXE TR1","Short Wave Receiver","$DEFAULTDIR$\","$DEFAULTDIR$\DSP1.EXE",7,REPLACE
SHOWREADME:$SOURCEDIR$\README.TXT
RUNATEXIT: "$WINDIR$\CONTROL.EXE DRIVERS"