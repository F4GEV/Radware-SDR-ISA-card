<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" role="img" aria-label="Horloge 10 MHz et alimentation -5 V" width="1180" height="660"><title>Horloge 10 MHz et alimentation -5 V</title><desc>Conditionneur d'horloge a inverseurs 74AHCT04 et inverseur de tension ICL7660</desc>
<style>
 .bg{fill:var(--bg,#ffffff)}
 .ink{stroke:var(--ink,#1b1f24);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
 .thin{stroke:var(--ink,#1b1f24);fill:none;stroke-width:1}
 .box{fill:var(--box,#f4f6f8);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxA{fill:var(--boxA,#e6f0fb);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxB{fill:var(--boxB,#fdf1dc);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .boxC{fill:var(--boxC,#e8f5e9);stroke:var(--ink,#1b1f24);stroke-width:1.6}
 .t{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:13px}
 .tb{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:14px;font-weight:700}
 .th{fill:var(--ink,#1b1f24);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:19px;font-weight:700}
 .m{fill:var(--ink,#1b1f24);font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
 .mm{fill:var(--mut,#59636e);font-family:ui-monospace,Consolas,Menlo,monospace;font-size:11px}
 .s{fill:var(--mut,#59636e);font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:12px}
 .pwr{stroke:var(--red,#c62828);fill:none;stroke-width:1.8}
 .gnd{stroke:var(--mut,#59636e);fill:none;stroke-width:1.8}
 .sig{stroke:var(--blue,#1565c0);fill:none;stroke-width:1.5}
 .ctl{stroke:var(--grn,#2e7d32);fill:none;stroke-width:1.8}
 .clk{stroke:var(--vio,#7b1fa2);fill:none;stroke-width:1.8}
 .dot{fill:var(--ink,#1b1f24)}
 .warn{fill:var(--warnbg,#fff4e5);stroke:var(--warn,#e65100);stroke-width:1.4}
</style>
<rect class="bg" width="1180" height="660"/><text class="th" x="24" y="34" text-anchor="start">Conditionneur d'horloge 10 MHz (-&gt; ISA B30) et generation du -5 V</text><text class="tb" x="24" y="70" text-anchor="start">A. Source sinus ou CMOS 3,3 V / 5 V  -&gt;  carre 5 V</text><g transform="translate(0,50)"><text class="m" x="24" y="108" text-anchor="start">10 MHz IN</text><line class="clk" x1="100" y1="104" x2="150" y2="104"/><line class="clk" x1="150" y1="104" x2="158" y2="104"/><line class="ink" x1="158" y1="92" x2="158" y2="116"/><line class="ink" x1="166" y1="92" x2="166" y2="116"/><line class="clk" x1="166" y1="104" x2="190" y2="104"/><text class="mm" x="150" y="84" text-anchor="start">100 nF</text><circle class="dot" cx="190" cy="104" r="3.2"/><polyline class="ink" points="220,88 220,120 252,104 220,88"/><circle class="ink" cx="256" cy="104" r="4"/><text class="mm" x="236" y="136" text-anchor="middle">IC1a</text><line class="clk" x1="190" y1="104" x2="220" y2="104"/><line class="ink" x1="190" y1="104" x2="190" y2="60"/><line class="ink" x1="190" y1="60" x2="262" y2="60"/><polyline class="ink" points="205,60 210,56 215,64 220,56 225,64 230,56 235,64 240,56 245,60"/><line class="ink" x1="262" y1="60" x2="262" y2="104"/><circle class="dot" cx="262" cy="104" r="3.2"/><text class="mm" x="204" y="44" text-anchor="start">1 Mohm (auto-polarisation)</text><line class="clk" x1="260" y1="104" x2="300" y2="104"/><polyline class="ink" points="300,88 300,120 332,104 300,88"/><circle class="ink" cx="336" cy="104" r="4"/><text class="mm" x="316" y="136" text-anchor="middle">IC1b</text><line class="clk" x1="340" y1="104" x2="380" y2="104"/><circle class="dot" cx="380" cy="104" r="3.2"/><line class="clk" x1="380" y1="104" x2="380" y2="74"/><line class="clk" x1="380" y1="74" x2="400" y2="74"/><line class="clk" x1="380" y1="104" x2="380" y2="134"/><line class="clk" x1="380" y1="134" x2="400" y2="134"/><polyline class="ink" points="400,58 400,90 432,74 400,58"/><circle class="ink" cx="436" cy="74" r="4"/><text class="mm" x="416" y="106" text-anchor="middle">IC1c</text><polyline class="ink" points="400,118 400,150 432,134 400,118"/><circle class="ink" cx="436" cy="134" r="4"/><text class="mm" x="416" y="166" text-anchor="middle">IC1d</text><line class="clk" x1="440" y1="74" x2="480" y2="74"/><line class="clk" x1="440" y1="134" x2="480" y2="134"/><line class="clk" x1="480" y1="74" x2="480" y2="134"/><circle class="dot" cx="480" cy="104" r="3.2"/><line class="clk" x1="480" y1="104" x2="520" y2="104"/><polyline class="ink" points="520,104 524,98 532,110 540,98 548,110 556,98 560,104"/><text class="mm" x="522" y="88" text-anchor="start">33 ohm</text><line class="clk" x1="560" y1="104" x2="640" y2="104"/><text class="m" x="648" y="108" text-anchor="start">ISA B30 (OSC)</text><text class="s" x="24" y="194" text-anchor="start">IC1 = 74AHCT04 (ou 74HCT04 / 74AC04) alimente en +5 V, 100 nF de decouplage au plus pres.</text><text class="s" x="24" y="212" text-anchor="start">Source deja carree 5 V CMOS (module OCXO/TCXO) : retirer le condensateur, la 1 Mohm et IC1a/IC1b ; garder IC1c/d + 33 ohm.</text><text class="s" x="24" y="230" text-anchor="start">Niveau mini en entree sinus : ~1 Vcc. Un GPSDO 10 MHz sinusoidal 0 dBm (0,63 Vcc sur 50 ohm) : ajouter un transformateur ou un ampli.</text><text class="s" x="24" y="248" text-anchor="start">L'AD7008 est declare jusqu'a 50 MHz : 10 MHz convient. Pas de terminaison 50 ohm sur B30 (entree CMOS).</text></g><g transform="translate(0,70)"><text class="tb" x="24" y="290" text-anchor="start">B. -5 V depuis le +5 V (la carte ne consomme que quelques mA sur ce rail : LF356 + ICL7621)</text><rect class="box" x="140" y="310" width="190" height="170" rx="6"/><text class="tb" x="235" y="334" text-anchor="middle">ICL7660 / MAX1044</text><text class="s" x="235" y="352" text-anchor="middle">(DIP-8)</text><text class="mm" x="148" y="384" text-anchor="start">2  CAP+</text><text class="mm" x="148" y="414" text-anchor="start">3  GND</text><text class="mm" x="148" y="444" text-anchor="start">4  CAP-</text><text class="mm" x="322" y="384" text-anchor="end">8  V+</text><text class="mm" x="322" y="414" text-anchor="end">7  OSC</text><text class="mm" x="322" y="444" text-anchor="end">6  LV</text><text class="mm" x="322" y="469" text-anchor="end">5  VOUT</text><line class="ink" x1="140" y1="380" x2="100" y2="380"/><line class="ink" x1="100" y1="380" x2="100" y2="402"/><line class="ink" x1="88" y1="402" x2="112" y2="402"/><line class="ink" x1="88" y1="410" x2="112" y2="410"/><line class="ink" x1="100" y1="410" x2="100" y2="440"/><line class="ink" x1="100" y1="440" x2="140" y2="440"/><text class="mm" x="24" y="408" text-anchor="start">C1 10 uF</text><text class="mm" x="24" y="424" text-anchor="start">(+ vers 2)</text><line class="pwr" x1="330" y1="380" x2="380" y2="380"/><text class="mm" x="386" y="384" text-anchor="start">+5 V (bus)</text><text class="mm" x="386" y="414" text-anchor="start">pin 7 et pin 6 : libres (VCC &gt; 3,5 V)</text><line class="pwr" x1="330" y1="465" x2="400" y2="465"/><text class="m" x="406" y="469" text-anchor="start">-5 V -&gt; ISA B5</text><line class="ink" x1="370" y1="465" x2="370" y2="488"/><line class="ink" x1="358" y1="488" x2="382" y2="488"/><line class="ink" x1="358" y1="496" x2="382" y2="496"/><line class="gnd" x1="370" y1="496" x2="370" y2="516"/><text class="mm" x="392" y="496" text-anchor="start">C2 10 uF (+ vers GND, - vers pin 5)</text><line class="gnd" x1="370" y1="516" x2="370" y2="524"/><line class="gnd" x1="361" y1="524" x2="379" y2="524"/><line class="gnd" x1="364" y1="528" x2="376" y2="528"/><line class="gnd" x1="367" y1="532" x2="373" y2="532"/><text class="s" x="24" y="545" text-anchor="start">Pin 3 = GND. Alternative : alimentation ATX ancienne avec -5 V, ou LM7905 depuis un -12 V. Ajouter un 100 nF / 10 uF pres de la carte.</text></g></svg>