TITLE: "ACME Zip Code Finder - Installation Program"

REM The following is for PC-Install for Windows
REM SCREENCOLOR red, black

BEGINFIRSTSCREEN
  Thank you for purchasing the ACME Zip Code Finder.  
  We are certain that you will find immediate productivity  
  gains having a zip code directory at your finger tips.
ENDFIRSTSCREEN

MINDISKSPACE: 100000
MINCPUTYPE: 80286

DEFAULTDIR: c:\zipcode

AUTOEXEC: addpath, ask
CONFIG: buffermin=40, filemin=30, ask

FILE: zipcode.exe, overwrite=no
FILE: ziphelp.txt, overwrite=no
FILE: newinfo.txt, overwrite=no
INSERTDISK: "Disk Two"
FILE: ?0000.dat, overwrite=new
INSERTDISK: "Disk Three"
FILE: ?0000.dat, overwrite=new

REM The following line is for PC-Install for Windows
REM WINITEM: "Zip Codes", "Zipcode.exe", "Zip Finder"

BEGINLASTSCREEN

  ACME technical support is available at (800) 555-0000.
 
ENDLASTSCREEN

SHOWREADME: newinfo.txt

RUNATEXIT: "zipcode.exe"
