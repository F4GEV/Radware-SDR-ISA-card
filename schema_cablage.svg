</style>
<rect class="bg" width="1300" height="1302"/><text class="th" x="24" y="34" text-anchor="start">Cablage direct : Arduino MEGA 2560 -&gt; bus ISA (cartes A et B en parallele)</text><text class="s" x="24" y="56" text-anchor="start">Un fil par signal, sans circuit intermediaire. Bleu = signal, vert = commande, rouge = +V, gris = masse, violet = horloge.</text><rect class="boxC" x="40" y="90" width="230" height="1008" rx="6"/><text class="tb" x="155.0" y="114" text-anchor="middle">Arduino MEGA 2560</text><text class="s" x="155.0" y="132" text-anchor="middle">(logique 5 V)</text><rect class="box" x="900" y="90" width="230" height="1008" rx="6"/><text class="tb" x="1015.0" y="114" text-anchor="middle">Connecteur ISA 16 bits</text><text class="s" x="1015.0" y="132" text-anchor="middle">(un seul slot, 2e slot en parallele)</text><text class="m" x="258" y="154" text-anchor="end">D22  (PA0)</text><line class="sig" x1="270" y1="150" x2="900" y2="150"/><text class="m" x="310" y="146" text-anchor="start">SD0</text><text class="m" x="914" y="154" text-anchor="start">A9</text><circle class="dot" cx="270" cy="150" r="3.2"/><circle class="dot" cx="900" cy="150" r="3.2"/><text class="m" x="258" y="178" text-anchor="end">D23  (PA1)</text><line class="sig" x1="270" y1="174" x2="900" y2="174"/><text class="m" x="310" y="170" text-anchor="start">SD1</text><text class="m" x="914" y="178" text-anchor="start">A8</text><circle class="dot" cx="270" cy="174" r="3.2"/><circle class="dot" cx="900" cy="174" r="3.2"/><text class="m" x="258" y="202" text-anchor="end">D24  (PA2)</text><line class="sig" x1="270" y1="198" x2="900" y2="198"/><text class="m" x="310" y="194" text-anchor="start">SD2</text><text class="m" x="914" y="202" text-anchor="start">A7</text><circle class="dot" cx="270" cy="198" r="3.2"/><circle class="dot" cx="900" cy="198" r="3.2"/><text class="m" x="258" y="226" text-anchor="end">D25  (PA3)</text><line class="sig" x1="270" y1="222" x2="900" y2="222"/><text class="m" x="310" y="2