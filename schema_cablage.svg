<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1302" role="img" aria-label="Cablage direct Arduino Mega bus ISA" width="1300" height="1302"><title>Cablage direct Arduino Mega bus ISA</title><desc>Table de correspondance des 26 lignes de bus et des broches de commande, d'alimentation et d'horloge</desc>
<style>
 .bg{fill:var(--bg,#ffffff)}
 .ink{stroke:var(--ink,#1b1f24);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
