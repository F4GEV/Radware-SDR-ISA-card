ne class="sig" x1="270" y1="528" x2="900" y2="528"/><text class="m" x="310" y="524" text-anchor="start">SD15</text><text class="m" x="914" y="532" text-anchor="start">C18</text><circle class="dot" cx="270" cy="528" r="3.2"/><circle class="dot" cx="900" cy="528" r="3.2"/><text class="m" x="258" y="574" text-anchor="end">D49  (PL0)</text><line class="sig" x1="270" y1="570" x2="900" y2="570"/><text class="m" x="310" y="566" text-anchor="start">SA0</text><text class="m" x="914" y="574" text-anchor="start">A31</text><circle class="dot" cx="270" cy="570" r="3.2"/><circle class="dot" cx="900" cy="570" r="3.2"/><text class="m" x="258" y="598" text-anchor="end">D48  (PL1)</text><line class="sig" x1="270" y1="594" x2="900" y2="594"/><text class="m" x="310" y="590" text-anchor="start">SA1</text><text class="m" x="914" y="598" text-anchor="start">A30</text><circle class="dot" cx="270" cy="594" r="3.2"/><circle class="dot" cx="900" cy="594" r="3.2"/><text class="m" x="258" y="622" text-anchor="end">D47  (PL2)</text><line class="sig" x1="270" y1="618" x2="900" y2="618"/><text class="m" x="310" y="614" text-anchor="start">SA2</text><text class="m" x="914" y="622" text-anchor="start">A29</text><circle class="dot" cx="270" cy="618" r="3.2"/><circle class="dot" cx="900" cy="618" r="3.2"/><text class="m" x="258" y="646" text-anchor="end">D46  (PL3)</text><line class="sig" x1="270" y1="642" x2="900" y2="642"/><text class="m" x="310" y="638" text-anchor="start">SA3</text><text class="m" x="914" y="646" text-anchor="start">A28</text><circle class="dot" cx="270" cy="642" r="3.2"/><circle class="dot" cx="900" cy="642" r="3.2"/><text class="m" x="258" y="670" text-anchor="end">D45  (PL4)</text><line class="sig" x1="270" y1="666" x2="900" y2="666"/><text class="m" x="310" y="662" text-anchor="start">SA4</text><text class="m" x="914" y="670" text-anchor="start">A27</text><circle class="dot" cx="270" cy="666" r="3.2"/><circle class="dot" cx="900" cy="666" r="3.2"/><text class="m" x="258" y="694" text-anchor="end">D44  (PL5)</text><line class="sig" x1="270" y1="690" x2="900" y2="690"/><text class="m" x="310" y="686" text-anchor="start">SA5</text><text class="m" x="914" y="694" text-anchor="start">A26</text><circle class="dot" cx="270" cy="690" r="3.2"/><circle class="dot" cx="900" cy="690" r="3.2"/><text class="m" x="258" y="718" text-anchor="end">D43  (PL6)</text><line class="sig" x1="270" y1="714" x2="900" y2="714"/><text class="m" x="310" y="710" text-anchor="start">SA6</text><text class="m" x="914" y="718" text-anchor="start">A25</text><circle class="dot" cx="270" cy="714" r="3.2"/><circle class="dot" cx="900" cy="714" r="3.2"/><text class="m" x="258" y="742" text-anchor="end">D42  (PL7)</text><line class="sig" x1="270" y1="738" x2="900" y2="738"/><text class="m" x="310" y="734" text-anchor="start">SA7</text><text class="m" x="914" y="742" text-anchor="start">A24</text><circle class="dot" cx="270" cy="738" r="3.2"/><circle class="dot" cx="900" cy="738" r="3.2"/><text class="m" x="258" y="784" text-anchor="end">D53  (PB0)</text><line class="sig" x1="270" y1="780" x2="900" y2="780"/><text class="m" x="310" y="776" text-anchor="start">SA8</text><text class="m" x="914" y="784" text-anchor="start">A23</text><circle class="dot" cx="270" cy="780" r="3.2"/><circle class="dot" cx="900" cy="780" r="3.2"/><text class="m" x="258" y="808" text-anchor="end">D52  (PB1)</text><line class="sig" x1="270" y1="804" x2="900" y2="804"/><text class="m" x="310" y="800" text-anchor="start">SA9</text><text class="m" x="914" y="808" text-anchor="start">A22</text><circle class="dot" cx="270" cy="804" r="3.2"/><circle class="dot" cx="900" cy="804" r="3.2"/><text class="tb" x="310" y="134" text-anchor="start">Octet bas des donnees (PORTA)</text><text class="tb" x="310" y="344" text-anchor="start">Octet haut des donnees (PORTC)</text><text class="tb" x="310" y="554" text-anchor="start">Adresses SA0..SA7 (PORTL)</text><text class="tb" x="310" y="764" text-anchor="start">Adresses SA8, SA9 (PORTB)</text><text class="m" x="914" y="872" text-anchor="start">B13</text><text class="mm" x="1118" y="872" text-anchor="end">/IOW</text><circle class="dot" cx="900" cy="868" r="3.2"/><text class="m" x="258" y="872" text-anchor="end">D8  (PH5)</text><line class="ctl" x1="270" y1="868" x2="900" y2="868"/><circle class="dot" cx="270" cy="868" r="3.2"/><text class="m" x="914" y="900" text-anchor="start">B14</text><text class="mm" x="1118" y="900" text-anchor="end">/IOR (pull-up 10k)</text><circle class="dot" cx="900" cy="896" r="3.2"/><text class="m" x="914" y="928" text-anchor="start">A11</text><text class="mm" x="1118" y="928" text-anchor="end">AEN -&gt; GND</text><circle class="dot" cx="900" cy="924" r="3.2"/><text class="m" x="914" y="956" text-anchor="start">B30</text><text class="mm" x="1118" y="956" text-anchor="end">OSC &lt;- 10 MHz</text><circle class="dot" cx="900" cy="952" r="3.2"/><text class="m" x="914" y="984" text-anchor="start">B3 B29 D16</text><text class="mm" x="1118" y="984" text-anchor="end">+5 V</text><circle class="dot" cx="900" cy="980" r="3.2"/><text class="m" x="914" y="1012" text-anchor="start">B9</text><text class="mm" x="1118" y="1012" text-anchor="end">+12 V</text><circle class="dot" cx="900" cy="1008" r="3.2"/><text class="m" x="914" y="1040" text-anchor="start">B5</text><text class="mm" x="1118" y="1040" text-anchor="end">-5 V</text><circle class="dot" cx="900" cy="1036" r="3.2"/><text class="m" x="914" y="1068" text-anchor="start">B1 B10 B31 D18</text><text class="mm" x="1118" y="1068" text-anchor="end">GND</text><circle class="dot" cx="900" cy="1064" r="3.2"/><text class="m" x="258" y="1068" text-anchor="end">GND</text><line class="gnd" x1="270" y1="1064" x2="900" y2="1064"/><circle class="dot" cx="270" cy="1064" r="3.2"/><text class="tb" x="310" y="860" text-anchor="start">Commande (/IOW) et masse</text><line class="ctl" x1="640" y1="868" x2="640" y2="894"/><polyline class="ink" points="640,894 640,900 634,903 646,909 634,915 646,921 640,924 640,930"/><text class="mm" x="650" y="916" text-anchor="start">10k</text><line class="pwr" x1="640" y1="930" x2="640" y2="940"/><text class="mm" x="626" y="954" text-anchor="start">+5V</text><circle class="dot" cx="640" cy="868" r="3.2"/><line class="clk" x1="900" y1="952" x2="480" y2="952"/><text class="s" x="480" y="944" text-anchor="start">10 MHz carre 5 V (schema_horloge_alim)</text><line class="pwr" x1="900" y1="980" x2="780" y2="980"/><line class="pwr" x1="900" y1="1008" x2="780" y2="1008"/><line class="pwr" x1="900" y1="1036" x2="780" y2="1036"/><text class="s" x="570" y="972" text-anchor="start">alimentation externe : +5 V, +12 V, -5 V  -&gt;</text><rect class="warn" x="24" y="1152" width="1252" height="130" rx="6"/><text class="tb" x="42" y="1178" text-anchor="start">Points importants</text><text class="s" x="42" y="1200" text-anchor="start">1) Relier seulement la masse (GND) du Mega a celle du bus. Ne PAS relier le 5V du Mega au +5 V du bus si le Mega est alimente par l'USB.</text><text class="s" x="42" y="1220" text-anchor="start">2) Mettre le bus sous tension AVANT de lancer le moniteur serie : les sorties du Mega alimenteraient sinon les cartes par leurs entrees.</text><text class="s" x="42" y="1240" text-anchor="start">3) Resistances serie de 33 ohm sur chaque ligne : optionnelles, recommandees si les fils depassent 15 cm.</text><text class="s" x="42" y="1260" text-anchor="start">4) Les cartes ne sont qu'en ecriture : /IOR, IRQ, DMA, IOCHRDY ne sont pas utilises. Pas de decodeur : un fil = un signal.</text></svg>